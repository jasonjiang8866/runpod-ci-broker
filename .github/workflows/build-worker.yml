name: Worker image offline build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: worker-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build pinned-base image and verify CPU refusal
        run: worker/build-image.sh "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: worker-build-${{ github.run_id }}
          path: out/image/
          if-no-files-found: error
          retention-days: 30
