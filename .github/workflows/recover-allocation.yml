name: Recover bounded allocation smoke
on:
  workflow_dispatch:
    inputs:
      confirm_cleanup:
        description: Reconcile and terminate only the reviewed allocation task; never create
        type: boolean
        default: false
  workflow_run:
    workflows: [Bounded allocation GPU smoke]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: broker-approved-campaign
  cancel-in-progress: false
jobs:
  controller:
    if: github.repository == 'jasonjiang8866/runpod-ci-broker' && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.confirm_cleanup) || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.path == '.github/workflows/allocation-smoke.yml'))
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RCB_LEDGER_TOKEN: ${{ github.token }}
      RCB_CONFIRM_CLEANUP: ${{ inputs.confirm_cleanup }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.13.5'
          enable-cache: false
      - run: uv sync --locked --no-dev --python 3.12
      - name: Recover identity and collect within original deadline
        if: always()
        continue-on-error: true
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: uv run --locked python -m runpod_ci_broker.allocation_workflow collect
      - name: Export verified bundle
        id: bundle
        if: always() && hashFiles('out/allocation/bundle/manifest.json') != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: allocation-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/allocation/bundle/
          if-no-files-found: error
          retention-days: 30
      - name: Verify durable upload receipt
        if: always() && steps.bundle.outcome == 'success'
        continue-on-error: true
        env:
          RCB_ARTIFACT_ID: ${{ steps.bundle.outputs.artifact-id }}
          RCB_ARTIFACT_DIGEST: ${{ steps.bundle.outputs.artifact-digest }}
        run: uv run --locked python -m runpod_ci_broker.allocation_workflow receipt
      - name: Terminate owned Pod and verify absence
        if: always()
        continue-on-error: true
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: uv run --locked python -m runpod_ci_broker.allocation_workflow cleanup
      - name: Require acceptance or verified recovery cleanup
        if: always()
        run: uv run --locked python -m runpod_ci_broker.allocation_workflow report
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: allocation-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/allocation/report.json
            out/allocation/summary.md
          if-no-files-found: warn
          retention-days: 30
      - name: Publish summary
        if: always()
        run: test ! -f out/allocation/summary.md || cat out/allocation/summary.md >> "$GITHUB_STEP_SUMMARY"
