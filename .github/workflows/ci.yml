name: Offline validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.13.5'
          enable-cache: false
      - run: uv sync --locked --group dev --python 3.12
      - run: uv run --locked ruff check src tests
      - run: uv run --locked ruff format --check src tests
      - run: uv run --locked mypy src
      - run: uv run --locked pytest --junitxml=out/tests.xml
      - name: Exercise credential-free CLI
        run: |
          uv run --locked runpod-ci-broker --config examples/simplexlora-flexible.json --mock-catalog examples/mock-catalog.json --output out/plan
          uv run --locked runpod-ci-broker --config examples/simplexlora-flexible.json --action simulate --mock-catalog examples/mock-catalog.json --output out/simulation
          uv run --locked runpod-ci-broker --config examples/simplexlora-flexible.json --action simulate --mock-catalog examples/mock-catalog.json --shared-mock-ledger .broker/shared.db --state-dir .broker/shared-drill --output out/shared
          uv run --locked runpod-ci-broker --config examples/simplexlora-flexible.json --action reconcile --mock-catalog examples/mock-catalog.json --shared-mock-ledger .broker/shared.db --state-dir .broker/shared-drill --output out/shared-recovered
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: offline-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          retention-days: 30
          if-no-files-found: error
