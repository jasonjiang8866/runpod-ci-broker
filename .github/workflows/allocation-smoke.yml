name: Bounded allocation GPU smoke
on:
  workflow_dispatch:
    inputs:
      confirm_paid:
        description: Continue the USD 20 campaign with all prior reservations; at most 3 new attempts
        type: boolean
        default: false
      window_end:
        description: Approved UTC epoch deadline; 600 to 1800 seconds remaining
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: broker-approved-campaign
  cancel-in-progress: false
jobs:
  controller:
    if: github.repository == 'jasonjiang8866/runpod-ci-broker' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.confirm_paid
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RCB_LEDGER_TOKEN: ${{ github.token }}
      RCB_CONFIRM_CLEANUP: ${{ inputs.confirm_cleanup }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.13.5'
          enable-cache: false
      - run: uv sync --locked --no-dev --python 3.12
      - name: Prepare runner-local evidence encryption
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: uv run --locked python -m runpod_ci_broker.sealed
      - name: Validate the reviewed task and execution window
        id: release
        env:
          RCB_WINDOW_END: ${{ inputs.window_end }}
        run: uv run --locked python -m runpod_ci_broker.allocation_workflow prepare --confirm-paid --window-end "$RCB_WINDOW_END"
      - name: Verify anonymous image pull and source
        timeout-minutes: 3
        env:
          RCB_WORKER_IMAGE: ${{ steps.release.outputs.image }}
          RCB_WORKER_SOURCE: ${{ steps.release.outputs.source_sha }}
          DOCKER_CONFIG: ${{ runner.temp }}/allocation-anonymous-docker
        run: |
          set -euo pipefail
          docker pull "$RCB_WORKER_IMAGE"
          actual="$(docker image inspect "$RCB_WORKER_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          test "$actual" = "$RCB_WORKER_SOURCE"
      - name: Search and create within the original budget
        continue-on-error: true
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RCB_WINDOW_END: ${{ inputs.window_end }}
        run: uv run --locked python -m runpod_ci_broker.allocation_workflow start --confirm-paid --window-end "$RCB_WINDOW_END"
      - name: Recover identity and collect within original deadline
        if: always()
        continue-on-error: true
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: uv run --locked python -m runpod_ci_broker.allocation_workflow collect
      - name: Export verified bundle
        id: bundle
        if: always() && hashFiles('out/allocation/bundle.enc') != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: allocation-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/allocation/bundle.enc
          if-no-files-found: error
          retention-days: 30
      - name: Verify durable upload receipt
        if: always() && steps.bundle.outcome == 'success'
        continue-on-error: true
        env:
          RCB_ARTIFACT_ID: ${{ steps.bundle.outputs.artifact-id }}
          RCB_ARTIFACT_DIGEST: ${{ steps.bundle.outputs.artifact-digest }}
        run: uv run --locked python -m runpod_ci_broker.allocation_workflow receipt
      - name: Terminate owned Pod and verify absence
        if: always()
        continue-on-error: true
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: uv run --locked python -m runpod_ci_broker.allocation_workflow cleanup
      - name: Require acceptance or verified recovery cleanup
        if: always()
        run: uv run --locked python -m runpod_ci_broker.allocation_workflow report
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: allocation-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/allocation/report.json
            out/allocation/summary.md
          if-no-files-found: warn
          retention-days: 30
      - name: Publish summary
        if: always()
        run: test ! -f out/allocation/summary.md || cat out/allocation/summary.md >> "$GITHUB_STEP_SUMMARY"
