name: Publish immutable smoke worker (manual)
on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Publish this main commit as the broker worker image
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: broker-worker-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'jasonjiang8866/runpod-ci-broker' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.confirm_publish
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build and validate immutable source
        run: worker/build-image.sh "$GITHUB_SHA"
      - name: Publish and record registry digest
        env:
          GHCR_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/rcb-docker
        run: |
          set -euo pipefail
          image="ghcr.io/jasonjiang8866/runpod-ci-broker-worker:sha-$GITHUB_SHA"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "rcb-worker:$GITHUB_SHA" "$image"
          docker push "$image"
          digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 2
          printf 'ghcr.io/jasonjiang8866/runpod-ci-broker-worker@%s\n' "$digest" > out/image/published-image.txt
          docker logout ghcr.io
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: worker-publication-${{ github.run_id }}
          path: out/image/
          if-no-files-found: error
          retention-days: 30
