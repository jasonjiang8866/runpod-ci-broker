name: Approved Broker GPU smoke
on:
  workflow_dispatch:
    inputs:
      confirm_paid:
        description: Use the existing USD 20 / 5 hour campaign, at most one short Pod attempt
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: broker-approved-campaign
  cancel-in-progress: false
jobs:
  controller:
    if: github.repository == 'jasonjiang8866/runpod-ci-broker' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.confirm_paid
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      RCB_LEDGER_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.13.5'
          enable-cache: false
      - run: uv sync --locked --no-dev --python 3.12
      - name: Verify anonymous pull of the reviewed image
        timeout-minutes: 3
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/broker-anonymous-docker
        run: |
          set -euo pipefail
          image="$(python -c 'import json; print(json.load(open("examples/approved-broker-smoke.json"))["image"])')"
          docker pull "$image"
          actual="$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          test "$actual" = '2e6fe6930c02fc2469079a1d8e64025562aff07f'
      - name: Persist intent and create at most once
        continue-on-error: true
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: uv run --locked python -m runpod_ci_broker.controller start --confirm-paid
      - name: Recover identity and collect within original deadline
        if: always()
        continue-on-error: true
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: uv run --locked python -m runpod_ci_broker.controller collect
      - name: Save verified bundle before cleanup
        id: bundle
        if: always() && hashFiles('out/live/bundle/manifest.json') != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smoke-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/live/bundle/
          if-no-files-found: error
          retention-days: 30
      - name: Verify durable upload receipt
        if: always() && steps.bundle.outcome == 'success'
        continue-on-error: true
        env:
          RCB_ARTIFACT_ID: ${{ steps.bundle.outputs.artifact-id }}
          RCB_ARTIFACT_DIGEST: ${{ steps.bundle.outputs.artifact-digest }}
        run: uv run --locked python -m runpod_ci_broker.controller receipt
      - name: Terminate owned Pod and verify absence
        if: always()
        continue-on-error: true
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: uv run --locked python -m runpod_ci_broker.controller cleanup
      - name: Require acceptance and report
        if: always()
        run: uv run --locked python -m runpod_ci_broker.controller report
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smoke-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/live/report.json
            out/live/summary.md
          if-no-files-found: warn
          retention-days: 30
      - name: Publish summary
        if: always()
        run: test ! -f out/live/summary.md || cat out/live/summary.md >> "$GITHUB_STEP_SUMMARY"
